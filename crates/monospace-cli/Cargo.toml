[package]
name = "monospace-cli"
description = "Minimal non-interactive command-line application for rendering ASCII diagrams"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
monospace-core.workspace = true
monospace-description.workspace = true
monospace-diagram.workspace = true
# The demonstration runs on a session rather than on the diagram it was handed, which is what makes
# the editing layer's ownership rule exercised rather than asserted. The binary still holds a diagram
# of its own: `render_once` draws one for a file it is given, and that path walks nowhere.
monospace-editing.workspace = true
monospace-glyph-sets.workspace = true

[dev-dependencies]
# The characterization in `src/sweep.rs`, at the same version the other two crates pin for theirs.
insta = "1.48.0"
# Only the tests build and rewrite JSON by hand (`serde_json::json!`), to vary one field of the
# shipped description. Production code reaches JSON through `monospace-description` alone.
serde_json = "=1.0.151"

[lints]
workspace = true
