[workspace]
members = [
  "crates/monospace",
  "crates/monospace-cli",
  "crates/monospace-core",
  "crates/monospace-description",
  "crates/monospace-diagram",
  "crates/monospace-editing",
  "crates/monospace-glyph-sets",
  "xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
authors = ["Andrés Moschini <andresmoschini@gmail.com>"]
license = "MIT"
repository = "https://github.com/andresmoschini/monospace"
homepage = "https://andresmoschini.github.io/monospace/"
readme = "README.md"
keywords = ["ascii-art", "diagram", "box-drawing", "plain-text", "tui"]
categories = [
  "command-line-utilities",
  "text-processing",
  "visualization",
  "rendering",
]

[workspace.dependencies]
# Each path carries a version as well, because crates.io refuses a dependency that has only a path.
# It is pinned with `=` and must match `workspace.package.version`: the crates are released together,
# and bumping the version means bumping these five with it.
monospace-core = { path = "crates/monospace-core", version = "=0.1.1" }
monospace-description = { path = "crates/monospace-description", version = "=0.1.1" }
monospace-diagram = { path = "crates/monospace-diagram", version = "=0.1.1" }
monospace-editing = { path = "crates/monospace-editing", version = "=0.1.1" }
monospace-glyph-sets = { path = "crates/monospace-glyph-sets", version = "=0.1.1" }

# Lints are declared here rather than passed on the command line so that rust-analyzer shows them
# while editing, and so that a crate added later inherits them instead of quietly opting out.
# They sit at "warn" locally; `cargo xtask check` runs clippy with `-D warnings`, so anything that
# warns fails the gate. To permit one, add it below with a comment saying why.
[workspace.lints.clippy]
# priority = -1 lets an individual lint added below override the group; Cargo rejects the
# combination without it.
pedantic = { level = "warn", priority = -1 }

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
invalid_codeblock_attributes = "deny"
invalid_rust_codeblocks = "deny"
invalid_html_tags = "deny"
bare_urls = "deny"
