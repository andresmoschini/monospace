# Pinned exactly, not tracked to a channel: the quality gate must fail because of a change made
# here, never because a new stable release taught rustfmt or clippy a new opinion overnight.
# Updating this file is its own task, with its own commit.
#
# The rule this serves is in AGENTS.md, under The rules, and where they live.
[toolchain]
channel = "1.98.1"
profile = "minimal"
components = ["rustfmt", "clippy", "rust-src"]
targets = ["wasm32-unknown-unknown"]
